name: PR validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check syntax
        run: |
          for file in extension.cjs review-store.cjs review-context.cjs mcp.cjs; do
            node --check "$file"
          done
          sh -n docker/start-codeserver.sh
          sh -n scripts/verify-vsix.sh
      - run: npm test
      - run: npm run package
      - name: Verify VSIX
        run: sh scripts/verify-vsix.sh
      - name: Name and checksum the build
        id: package
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          prefix=main
          if [ -n "$PR_NUMBER" ]; then prefix="pr-$PR_NUMBER"; fi
          filename="local-review-$prefix-${GITHUB_SHA:0:12}.vsix"
          mv local-review.vsix "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          sha256sum "$filename" > checksum.txt
      - name: Upload installable VSIX
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.filename }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Add download link
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo "### [Download the VSIX]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          printf 'SHA-256\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          cat checksum.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
