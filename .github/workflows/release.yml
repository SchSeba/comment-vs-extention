name: Publish VSIX release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish tagged VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: sh scripts/verify-vsix.sh
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum local-review.vsix > local-review.vsix.sha256
          gh release create "$GITHUB_REF_NAME" local-review.vsix local-review.vsix.sha256 --verify-tag --generate-notes
